<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 210" role="img" aria-labelledby="title desc">
  <title id="title">Plante bloom</title>
  <desc id="desc">Une petite plante verte dans un pot souriant.</desc>
